<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creatopz Outreach Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --subtle: #f7f7f8;
    --border: #e8e8ec;
    --text: #1a1a1f;
    --muted: #6b6b76;
    --accent: #2f5bea;
    --accent-hover: #2449c4;
    --warn-bg: #fff8e6;
    --warn-border: #f3dfa2;
    --danger: #d64545;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,16,24,.04), 0 4px 16px rgba(16,16,24,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif; font-size: 14px; line-height: 1.45; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 32px 24px 64px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin-top: 2px; }

  .btn { font: inherit; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 9px 14px; border-radius: 9px; cursor: pointer; }
  .btn:hover { background: var(--subtle); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 10px 18px; box-shadow: 0 1px 2px rgba(47,91,234,.3); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .6; cursor: default; }

  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .stat .label { color: var(--muted); font-size: 12px; font-weight: 500; }
  .stat .value { font-size: 28px; font-weight: 600; margin-top: 4px; letter-spacing: -0.02em; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input, .toolbar select { font: inherit; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); }
  .toolbar input { flex: 1; min-width: 200px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,91,234,.12); }

  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 1100px; }
  th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 12px 14px; background: var(--subtle); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafafb; }
  tbody tr.due { background: var(--warn-bg); box-shadow: inset 3px 0 0 var(--warn-border); }
  tbody tr.due:hover { background: #fff4d6; }
  .brand { font-weight: 600; }
  .industry { color: var(--muted); font-size: 12px; }
  .notes { max-width: 260px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .nowrap { white-space: nowrap; }
  .overdue { color: #b26a00; font-size: 12px; font-weight: 500; }
  .actions { display: flex; gap: 6px; }
  .actions .btn { padding: 5px 10px; font-size: 13px; }

  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: #eef0f3; color: #45454f; }
  .pill.s-message { background: #e8f0fe; color: #2449c4; }
  .pill.s-follow { background: #fdf0e0; color: #9a5b00; }
  .pill.s-replied { background: #e6f5ee; color: #1c7a4d; }
  .pill.s-interested { background: #e1f4f5; color: #12717a; }
  .pill.s-meeting { background: #efe9fb; color: #5b3bb5; }
  .pill.s-lost { background: #fbeaea; color: #b03636; }
  .pill.s-closed { background: #dff5e5; color: #16693a; }

  .empty { padding: 48px 16px; text-align: center; color: var(--muted); }
  .banner { background: #fdeeee; border: 1px solid #f3c6c6; color: #8f2b2b; padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; display: none; }
  .banner.show { display: block; }

  .overlay { position: fixed; inset: 0; background: rgba(20,20,28,.35); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 10; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 640px; box-shadow: 0 12px 48px rgba(16,16,24,.2); }
  .modal header { margin: 0; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .modal h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .modal form { padding: 20px 22px 22px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12px; font-weight: 500; color: var(--muted); }
  .field input, .field select, .field textarea { font: inherit; padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px; background: #fff; color: var(--text); }
  .field textarea { min-height: 84px; resize: vertical; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  @media (max-width: 900px) { .stats { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) {
    .wrap { padding: 20px 14px 48px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr; }
    .toolbar select { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Creatopz Outreach Tracker</h1>
      <div class="sub">Every brand you've contacted, in one place.</div>
    </div>
    <button class="btn primary" id="addBtn">+ Add Brand</button>
  </header>

  <div class="banner" id="banner"></div>

  <section class="stats">
    <div class="stat"><div class="label">Total Brands</div><div class="value" id="st-total">0</div></div>
    <div class="stat"><div class="label">Contacted</div><div class="value" id="st-contacted">0</div></div>
    <div class="stat"><div class="label">Awaiting Reply</div><div class="value" id="st-awaiting">0</div></div>
    <div class="stat"><div class="label">Replied</div><div class="value" id="st-replied">0</div></div>
    <div class="stat"><div class="label">Interested</div><div class="value" id="st-interested">0</div></div>
    <div class="stat"><div class="label">Deals Closed</div><div class="value" id="st-closed">0</div></div>
  </section>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search brand, contact, industry, notes…">
    <select id="fStatus"><option value="">All statuses</option></select>
    <select id="fPlatform"><option value="">All platforms</option></select>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Brand</th><th>Contact Name</th><th>Role</th><th>Platform</th><th>Status</th>
            <th>Last Contact</th><th>Next Follow-Up</th><th>Notes</th><th>Edit</th><th>Delete</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header><h2 id="modalTitle">Add Brand</h2></header>
    <form id="form">
      <div class="grid">
        <div class="field"><label for="brand_name">Brand Name *</label><input id="brand_name" required></div>
        <div class="field"><label for="industry">Industry</label><input id="industry"></div>
        <div class="field"><label for="contact_name">Contact Name</label><input id="contact_name"></div>
        <div class="field"><label for="contact_role">Contact Role</label><select id="contact_role"></select></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email"></div>
        <div class="field"><label for="instagram">Instagram</label><input id="instagram" placeholder="@handle"></div>
        <div class="field"><label for="platform">Outreach Platform</label><select id="platform"></select></div>
        <div class="field"><label for="status">Status</label><select id="status"></select></div>
        <div class="field"><label for="last_contact">Last Contact Date</label><input id="last_contact" type="date"></div>
        <div class="field"><label for="next_followup">Next Follow-Up Date</label><input id="next_followup" type="date"></div>
        <div class="field full"><label for="notes">Notes</label><textarea id="notes"></textarea></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
  // ====== CONFIG: paste your Supabase project values here ======
  const SUPABASE_URL = 'https://fxkfquawgnpknsbgqqjj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_MUDzmi9S6ozqec_2eclIJw_AEbTTFil';
  // =============================================================

  const ROLES = ['Owner','Founder','Co-Founder','CEO','Brand Manager','Marketing Manager','Influencer Marketing Manager','Social Media Manager','Partnership Manager','Other'];
  const PLATFORMS = ['Instagram DM','Email','LinkedIn','WhatsApp','Website Form','Referral'];
  const STATUSES = ['Not Contacted','Message Sent','Follow-Up 1','Follow-Up 2','Follow-Up 3','Replied','Interested','Meeting Scheduled','Not Interested','No Response','Deal Closed'];
  const AWAITING = ['Message Sent','Follow-Up 1','Follow-Up 2','Follow-Up 3'];
  const REPLIED = ['Replied','Interested','Meeting Scheduled','Deal Closed'];
  const NO_FOLLOWUP_NEEDED = ['Deal Closed','Not Interested'];

  const $ = id => document.getElementById(id);
  const configured = !SUPABASE_URL.startsWith('YOUR_');
  const db = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  let brands = [];
  let editingId = null;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const opts = (list, blank) => (blank ? `<option value="">—</option>` : '') + list.map(v => `<option>${esc(v)}</option>`).join('');

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function fmtDate(s) {
    if (!s) return '—';
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m-1, d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function isDue(b) {
    return !!b.next_followup && b.next_followup <= todayStr() && !NO_FOLLOWUP_NEEDED.includes(b.status);
  }
  function pillClass(s) {
    if (s === 'Message Sent') return 's-message';
    if (s.startsWith('Follow-Up')) return 's-follow';
    if (s === 'Replied') return 's-replied';
    if (s === 'Interested') return 's-interested';
    if (s === 'Meeting Scheduled') return 's-meeting';
    if (s === 'Not Interested' || s === 'No Response') return 's-lost';
    if (s === 'Deal Closed') return 's-closed';
    return '';
  }
  function showError(msg) {
    const b = $('banner');
    b.textContent = msg;
    b.classList.toggle('show', !!msg);
  }

  // ---- data ----
  async function load() {
    if (!configured) {
      showError('Supabase is not connected yet. Open index.html and set SUPABASE_URL and SUPABASE_ANON_KEY at the top of the script.');
      render();
      return;
    }
    const { data, error } = await db.from('brands').select('*').order('created_at', { ascending: false });
    if (error) { showError('Could not load brands: ' + error.message); return; }
    showError('');
    brands = data;
    render();
  }

  // ---- render ----
  function render() {
    $('st-total').textContent = brands.length;
    $('st-contacted').textContent = brands.filter(b => b.status !== 'Not Contacted').length;
    $('st-awaiting').textContent = brands.filter(b => AWAITING.includes(b.status)).length;
    $('st-replied').textContent = brands.filter(b => REPLIED.includes(b.status)).length;
    $('st-interested').textContent = brands.filter(b => b.status === 'Interested').length;
    $('st-closed').textContent = brands.filter(b => b.status === 'Deal Closed').length;

    const q = $('search').value.trim().toLowerCase();
    const fs = $('fStatus').value, fp = $('fPlatform').value;
    const list = brands.filter(b =>
      (!fs || b.status === fs) && (!fp || b.platform === fp) &&
      (!q || [b.brand_name, b.industry, b.contact_name, b.contact_role, b.email, b.instagram, b.notes].some(v => (v || '').toLowerCase().includes(q)))
    );

    $('rows').innerHTML = list.map(b => {
      const due = isDue(b);
      return `<tr class="${due ? 'due' : ''}">
        <td><div class="brand">${esc(b.brand_name)}</div><div class="industry">${esc(b.industry)}</div></td>
        <td>${esc(b.contact_name) || '—'}</td>
        <td>${esc(b.contact_role) || '—'}</td>
        <td class="nowrap">${esc(b.platform) || '—'}</td>
        <td><span class="pill ${pillClass(b.status)}">${esc(b.status)}</span></td>
        <td class="nowrap">${fmtDate(b.last_contact)}</td>
        <td class="nowrap">${fmtDate(b.next_followup)}${due ? `<div class="overdue">${b.next_followup === todayStr() ? 'Due today' : 'Overdue'}</div>` : ''}</td>
        <td class="notes">${esc(b.notes)}</td>
        <td><div class="actions"><button class="btn" data-edit="${b.id}">Edit</button></div></td>
        <td><div class="actions"><button class="btn danger" data-del="${b.id}">Delete</button></div></td>
      </tr>`;
    }).join('');

    const empty = $('empty');
    empty.style.display = list.length ? 'none' : 'block';
    empty.textContent = brands.length ? 'No brands match your filters.' : 'No brands yet. Click “Add Brand” to log your first outreach.';
  }

  // ---- modal ----
  const FIELDS = ['brand_name','industry','contact_name','contact_role','email','instagram','platform','status','last_contact','next_followup','notes'];

  function openModal(b) {
    editingId = b ? b.id : null;
    $('modalTitle').textContent = b ? 'Edit Brand' : 'Add Brand';
    FIELDS.forEach(f => {
      const el = $(f);
      el.value = b ? (b[f] ?? '') : (f === 'status' ? 'Not Contacted' : '');
    });
    $('overlay').classList.add('open');
    $('brand_name').focus();
  }
  function closeModal() { $('overlay').classList.remove('open'); }

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!configured) { showError('Connect Supabase first (see top of the script).'); closeModal(); return; }
    const row = {};
    FIELDS.forEach(f => { const v = $(f).value.trim(); row[f] = v === '' ? null : v; });
    row.status = row.status || 'Not Contacted';

    const btn = $('saveBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const { error } = editingId
        ? await db.from('brands').update(row).eq('id', editingId)
        : await db.from('brands').insert(row);
      if (error) throw error;
      closeModal();
      load();
    } catch (err) {
      console.error('Save failed:', err);
      alert('Could not save: ' + (err.message || err));
    } finally {
      btn.disabled = false; btn.textContent = 'Save';
    }
  });

  $('rows').addEventListener('click', async e => {
    const edit = e.target.closest('[data-edit]');
    const del = e.target.closest('[data-del]');
    if (edit) openModal(brands.find(b => b.id === edit.dataset.edit));
    if (del) {
      const b = brands.find(x => x.id === del.dataset.del);
      if (!confirm(`Delete "${b.brand_name}"? This can't be undone.`)) return;
      const { error } = await db.from('brands').delete().eq('id', b.id);
      if (error) { alert('Could not delete: ' + error.message); return; }
      load();
    }
  });

  // ---- init ----
  $('contact_role').innerHTML = opts(ROLES, true);
  $('platform').innerHTML = opts(PLATFORMS, true);
  $('status').innerHTML = opts(STATUSES);
  $('fStatus').innerHTML = '<option value="">All statuses</option>' + opts(STATUSES);
  $('fPlatform').innerHTML = '<option value="">All platforms</option>' + opts(PLATFORMS);

  $('addBtn').addEventListener('click', () => openModal(null));
  $('cancelBtn').addEventListener('click', closeModal);
  $('overlay').addEventListener('mousedown', e => { if (e.target === $('overlay')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  ['search','fStatus','fPlatform'].forEach(id => $(id).addEventListener('input', render));

  load();
</script>
</body>
</html>
